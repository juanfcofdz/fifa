<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quiniela Mundial FIFA 2026</title>
<style>
/* ── Variables ───────────────────────────── */
:root{
  --mx-green:#006847;--mx-red:#CE1126;--mx-white:#FFFFFF;
  --color-bg:#F7F7F7;--color-surface:#FFFFFF;--color-surface-2:#F0F0F0;
  --color-border:#E0E0E0;--color-border-2:#CACACA;
  --color-text:#1A1A1A;--color-muted:#757575;--color-muted-2:#AAAAAA;
  --color-advance:#006847;--color-potential:#B07A00;
  --color-eliminated:#BBBBBB;--color-winner:#006847;
  --color-loser:#D0D0D0;--color-danger:#CE1126;
  --color-cta:#006847;--color-cta-hover:#005238;
  --sp-xs:4px;--sp-sm:8px;--sp-md:16px;--sp-lg:24px;--sp-xl:40px;
  --radius-sm:4px;--radius:8px;--radius-lg:12px;
  --shadow:0 1px 4px rgba(0,0,0,.08);--shadow-md:0 2px 10px rgba(0,0,0,.10);
  --match-h-r32:90px;--match-h-r16:180px;--match-h-qf:360px;
  --match-h-sf:720px;--match-h-final:1440px;--connector-w:28px;
}
/* ── Reset ───────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14px;background:var(--color-bg);color:var(--color-text);min-height:100vh;}
button{cursor:pointer;font-family:inherit;font-size:inherit;border:none;background:none;}
/* ── Header ──────────────────────────────── */
.app-header{background:var(--color-surface);box-shadow:var(--shadow);
  position:sticky;top:0;z-index:100;}
.app-header::before{content:'';display:block;height:4px;
  background:linear-gradient(to right,#006847 33.33%,#fff 33.33% 66.66%,#CE1126 66.66%);}
.header-inner{max-width:1400px;margin:0 auto;padding:0 var(--sp-md);
  display:flex;align-items:center;justify-content:space-between;height:52px;gap:var(--sp-md);}
.app-title{font-size:15px;font-weight:700;white-space:nowrap;letter-spacing:-.2px;}
.app-title span{color:var(--mx-green);}
.tab-bar{display:flex;gap:2px;}
.tab-btn{padding:6px 18px;border-radius:var(--radius-sm);font-size:13px;
  font-weight:500;color:var(--color-muted);transition:background .15s,color .15s;}
.tab-btn:hover{background:var(--color-surface-2);color:var(--color-text);}
.tab-btn.active{background:var(--mx-green);color:#fff;}
/* ── Page ────────────────────────────────── */
.page{max-width:1400px;margin:0 auto;padding:var(--sp-lg) var(--sp-md);}
/* ── Phase header ────────────────────────── */
.phase-header{display:flex;align-items:flex-start;justify-content:space-between;
  flex-wrap:wrap;gap:var(--sp-sm);margin-bottom:var(--sp-lg);}
.phase-title{font-size:20px;font-weight:700;}
.phase-subtitle{font-size:13px;color:var(--color-muted);margin-top:2px;}
/* ── Buttons ─────────────────────────────── */
.btn-cta{background:var(--color-cta);color:#fff;padding:10px 22px;
  border-radius:var(--radius);font-weight:600;font-size:14px;
  transition:background .15s,transform .1s;}
.btn-cta:hover{background:var(--color-cta-hover);}
.btn-cta:active{transform:scale(.97);}
.btn-cta:disabled{background:var(--color-border-2);color:var(--color-muted);cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--color-muted);padding:8px 16px;
  border:1px solid var(--color-border);border-radius:var(--radius);font-size:13px;
  font-weight:500;transition:border-color .15s,color .15s;}
.btn-ghost:hover{border-color:var(--color-border-2);color:var(--color-text);}
/* ── Groups grid ─────────────────────────── */
.groups-grid{display:grid;grid-template-columns:repeat(4,1fr);
  gap:var(--sp-md);margin-bottom:var(--sp-xl);}
@media(max-width:1100px){.groups-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:780px){.groups-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:500px){.groups-grid{grid-template-columns:1fr;}}
.group-card{background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-lg);padding:var(--sp-md);box-shadow:var(--shadow);}
.group-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-sm);}
.group-label{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--color-muted);}
.group-name{font-size:17px;font-weight:800;color:var(--mx-green);}
.team-list{list-style:none;}
.team-row{display:flex;align-items:center;gap:var(--sp-sm);padding:5px 6px;
  border-radius:var(--radius-sm);transition:background .12s;user-select:none;}
.team-row.dragging{opacity:.5;}
.team-row.drag-over{background:#e8f5ed;}
.team-row:hover{background:var(--color-surface-2);}
.drag-handle{color:var(--color-muted-2);font-size:12px;cursor:grab;padding:2px 4px;flex-shrink:0;line-height:1;}
.drag-handle:active{cursor:grabbing;}
@media(max-width:768px){.drag-handle{display:none;}}
.arrow-btns{display:none;flex-direction:column;gap:1px;flex-shrink:0;}
@media(max-width:768px){.arrow-btns{display:flex;}}
.arrow-btn{color:var(--color-muted-2);font-size:10px;line-height:1;padding:1px 3px;
  border-radius:2px;transition:color .1s,background .1s;}
.arrow-btn:hover:not(:disabled){color:var(--mx-green);background:#e8f5ed;}
.arrow-btn:disabled{opacity:.3;cursor:default;}
.team-position{width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;}
.pos-1,.pos-2{background:var(--color-advance);}
.pos-3{background:var(--color-potential);}
.pos-4{background:var(--color-muted-2);}
.team-flag{font-size:18px;flex-shrink:0;}
.team-name{flex:1;font-size:13px;font-weight:500;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.team-name.eliminated{color:var(--color-eliminated);}
.team-odds{font-size:11px;color:var(--color-muted);flex-shrink:0;min-width:28px;text-align:right;}
.stage-actions{display:flex;justify-content:flex-end;gap:var(--sp-sm);margin-top:var(--sp-sm);}
/* ── Best Third ──────────────────────────── */
.best-third-page{max-width:700px;margin:0 auto;}
.third-counter{display:inline-flex;align-items:center;gap:var(--sp-sm);
  background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius);padding:6px 14px;font-size:13px;color:var(--color-muted);}
.third-counter strong{color:var(--color-text);font-size:15px;}
.third-counter.complete strong{color:var(--mx-green);}
.third-counter.over strong{color:var(--mx-red);}
.third-list{list-style:none;margin:var(--sp-lg) 0;display:flex;flex-direction:column;gap:var(--sp-sm);}
.third-item{display:flex;align-items:center;gap:var(--sp-md);background:var(--color-surface);
  border:2px solid var(--color-border);border-radius:var(--radius);padding:10px var(--sp-md);
  cursor:pointer;transition:border-color .15s,background .15s;}
.third-item.selected{border-color:var(--mx-green);background:#f0faf4;}
.third-item.selected .third-check{background:var(--mx-green);color:#fff;border-color:var(--mx-green);}
.third-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--color-border-2);
  display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;
  transition:background .15s,border-color .15s;}
.third-rank{font-size:11px;color:var(--color-muted);min-width:52px;font-variant-numeric:tabular-nums;}
.third-group{font-size:11px;font-weight:700;color:var(--color-muted);min-width:32px;}
/* ── Bracket ─────────────────────────────── */
.bracket-scroll-outer{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:var(--sp-md);}
.bracket-inner{display:flex;gap:0;align-items:flex-start;min-width:min-content;padding:var(--sp-sm) 0;}
.bracket-round{display:flex;flex-direction:column;flex-shrink:0;}
.round-label{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--color-muted);text-align:center;padding:0 var(--sp-sm) var(--sp-sm);white-space:nowrap;}
.bracket-match-slot{display:flex;align-items:center;justify-content:center;position:relative;}
.bracket-match-slot.r32{height:var(--match-h-r32);}
.bracket-match-slot.r16{height:var(--match-h-r16);}
.bracket-match-slot.qf{height:var(--match-h-qf);}
.bracket-match-slot.sf{height:var(--match-h-sf);}
.bracket-match-slot.final{height:var(--match-h-final);}
.bracket-match-slot::after{content:'';position:absolute;right:calc(-1 * var(--connector-w));
  top:50%;width:var(--connector-w);height:1px;background:var(--color-border-2);}
.bracket-match-slot.final::after{display:none;}
.bracket-match-slot.pair-top::before{content:'';position:absolute;
  right:calc(-1 * var(--connector-w));top:50%;height:100%;width:1px;background:var(--color-border-2);}
.bracket-card{background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;width:192px;flex-shrink:0;}
.bracket-match-info{padding:4px 8px;background:var(--color-surface-2);
  border-bottom:1px solid var(--color-border);font-size:10px;color:var(--color-muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bracket-team{display:flex;align-items:center;gap:7px;padding:8px 10px;cursor:pointer;
  transition:background .12s;border-bottom:1px solid var(--color-border);min-height:40px;}
.bracket-team:last-child{border-bottom:none;}
.bracket-team:hover:not(.tbd):not(.loser){background:#f0faf4;}
.bracket-team.winner{background:#e8f5ed;font-weight:600;}
.bracket-team.winner .bt-name{color:var(--mx-green);}
.bracket-team.loser{opacity:.42;cursor:not-allowed;}
.bracket-team.tbd{cursor:default;}
.bt-flag{font-size:16px;flex-shrink:0;}
.bt-name{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--color-text);}
.bt-name.tbd-text{color:var(--color-muted-2);font-style:italic;}
.bt-check{font-size:12px;color:var(--mx-green);flex-shrink:0;}
.bracket-gap{width:var(--connector-w);flex-shrink:0;}
/* ── Champion ────────────────────────────── */
.champion-banner{text-align:center;padding:var(--sp-xl) var(--sp-md);animation:fadeIn .5s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.champion-trophy{font-size:56px;margin-bottom:var(--sp-md);}
.champion-label{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--mx-green);margin-bottom:var(--sp-sm);}
.champion-name{font-size:36px;font-weight:800;color:var(--color-text);margin-bottom:var(--sp-sm);}
.champion-flag{font-size:48px;}
.champion-reset{margin-top:var(--sp-xl);}
/* ── Stats ───────────────────────────────── */
.stats-tabs{display:flex;gap:2px;margin-bottom:var(--sp-lg);
  border-bottom:1px solid var(--color-border);padding-bottom:0;}
.stats-tab{padding:8px 20px;font-size:13px;font-weight:500;color:var(--color-muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;}
.stats-tab:hover{color:var(--color-text);}
.stats-tab.active{color:var(--mx-green);border-bottom-color:var(--mx-green);font-weight:600;}
.stats-section-header{display:flex;align-items:baseline;gap:var(--sp-md);
  margin-bottom:var(--sp-md);flex-wrap:wrap;}
.stats-section-title{font-size:17px;font-weight:700;}
.stats-updated{font-size:11px;color:var(--color-muted);background:var(--color-surface-2);
  padding:2px 8px;border-radius:10px;}
.stats-source{font-size:11px;color:var(--color-muted);margin-top:var(--sp-md);}
.poly-groups-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-md);}
@media(max-width:900px){.poly-groups-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:500px){.poly-groups-grid{grid-template-columns:1fr;}}
.poly-group-card{background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-lg);padding:var(--sp-md);box-shadow:var(--shadow);}
.poly-group-title{font-size:13px;font-weight:700;color:var(--mx-green);margin-bottom:var(--sp-sm);}
.poly-team-row{display:flex;align-items:center;gap:var(--sp-sm);padding:4px 0;}
.poly-bar-wrap{flex:1;height:6px;background:var(--color-surface-2);border-radius:3px;overflow:hidden;}
.poly-bar{height:100%;border-radius:3px;background:var(--mx-green);transition:width .4s ease;}
.poly-pct{font-size:11px;font-variant-numeric:tabular-nums;color:var(--color-muted);min-width:28px;text-align:right;}
.rankings-table{width:100%;border-collapse:collapse;background:var(--color-surface);
  border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);}
.rankings-table th{text-align:left;padding:10px 14px;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;color:var(--color-muted);
  background:var(--color-surface-2);border-bottom:1px solid var(--color-border);}
.rankings-table td{padding:8px 14px;font-size:13px;border-bottom:1px solid var(--color-border);}
.rankings-table tr:last-child td{border-bottom:none;}
.rankings-table tbody tr:hover{background:var(--color-surface-2);}
.rank-num{font-variant-numeric:tabular-nums;color:var(--color-muted);font-size:12px;min-width:30px;}
.rank-group-badge{display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;background:var(--color-surface-2);
  font-size:11px;font-weight:700;color:var(--mx-green);border:1px solid var(--color-border);}
/* ── Misc ────────────────────────────────── */
.hidden{display:none!important;}
.text-muted{color:var(--color-muted);}
.text-small{font-size:12px;}
.bracket-phase-steps{display:flex;gap:var(--sp-sm);align-items:center;font-size:12px;color:var(--color-muted);}
.bracket-phase-steps .step{padding:3px 10px;border-radius:10px;background:var(--color-surface-2);}
.bracket-phase-steps .step.active{background:var(--mx-green);color:#fff;font-weight:600;}
.bracket-phase-steps .step.done{background:#e8f5ed;color:var(--mx-green);}
.bracket-phase-steps .sep{color:var(--color-muted-2);}
/* ── Lobby ───────────────────────────────── */
.lobby-page{display:flex;justify-content:center;align-items:flex-start;padding:var(--sp-xl) var(--sp-md);min-height:60vh;}
.lobby-card{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:40px 36px;max-width:420px;width:100%;text-align:center;}
.lobby-logo{font-size:40px;margin-bottom:var(--sp-md);}
.lobby-title{font-size:22px;font-weight:700;margin-bottom:6px;}
.lobby-subtitle{color:var(--color-muted);font-size:13px;margin-bottom:32px;}
.lobby-btn{display:block;width:100%;padding:14px;font-size:15px;font-weight:600;border-radius:var(--radius);margin-bottom:12px;cursor:pointer;transition:opacity .15s;}
.lobby-btn.primary{background:var(--mx-green);color:#fff;border:none;}
.lobby-btn.primary:hover{opacity:.88;}
.lobby-btn.secondary{background:transparent;color:var(--mx-green);border:2px solid var(--mx-green);}
.lobby-btn.secondary:hover{background:#f0faf5;}
.lobby-divider{display:flex;align-items:center;gap:12px;color:var(--color-muted);margin:8px 0 16px;font-size:12px;}
.lobby-divider::before,.lobby-divider::after{content:'';flex:1;height:1px;background:var(--color-border);}
.lobby-input{width:100%;padding:11px 14px;border:1.5px solid var(--color-border);border-radius:var(--radius);font-size:15px;margin-bottom:10px;outline:none;font-family:inherit;transition:border-color .2s;}
.lobby-input:focus{border-color:var(--mx-green);}
.lobby-error{color:var(--mx-red);font-size:12px;margin:-4px 0 10px;text-align:left;}
.lobby-back{font-size:12px;color:var(--color-muted);cursor:pointer;display:inline-block;margin-bottom:20px;}
.lobby-back:hover{color:var(--mx-green);}
/* Code display card */
.code-display{background:var(--color-bg);border-radius:var(--radius);padding:20px;margin:16px 0;text-align:left;}
.code-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.code-row:last-child{margin-bottom:0;}
.code-key{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--color-muted);}
.code-val{font-size:18px;font-weight:700;letter-spacing:3px;font-family:monospace;color:var(--color-text);}
.code-val.green{color:var(--mx-green);}
.code-val.red{color:var(--mx-red);}
.code-note{font-size:11px;color:var(--color-muted);line-height:1.5;}
/* Quiniela banner */
.quiniela-banner{background:var(--mx-green);color:#fff;padding:8px var(--sp-md);font-size:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.quiniela-banner strong{font-weight:700;}
.quiniela-banner .qb-sep{opacity:.5;}
/* Leaderboard */
.leaderboard-table{width:100%;border-collapse:collapse;background:var(--color-surface);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);}
.leaderboard-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--color-muted);padding:10px 14px;border-bottom:2px solid var(--color-border);}
.leaderboard-table td{padding:13px 14px;border-bottom:1px solid var(--color-border);vertical-align:middle;}
.leaderboard-table tr:last-child td{border-bottom:none;}
.lb-rank{font-weight:700;font-size:15px;}
.lb-rank.gold{color:#B8860B;}
.lb-rank.silver{color:#888;}
.lb-rank.bronze{color:#8B4513;}
.lb-name{font-weight:600;}
.lb-champion{display:flex;align-items:center;gap:6px;font-size:13px;}
.lb-score{text-align:right;font-weight:700;font-size:16px;color:var(--mx-green);}
.lb-score.pending{color:var(--color-muted-2);font-size:12px;font-weight:400;}
.lb-you{background:#f0faf5;}
.leaderboard-actions{margin-top:var(--sp-lg);display:flex;gap:12px;flex-wrap:wrap;}
.loading-spinner{text-align:center;padding:40px;color:var(--color-muted);}
.admin-section{background:var(--color-surface);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow);max-width:460px;margin:0 auto;}
.admin-warning{background:#fff8f8;border:1px solid var(--mx-red);border-radius:var(--radius);padding:12px;font-size:12px;color:var(--mx-red);margin-bottom:var(--sp-md);}
/* ── Phase notes ─────────────────────────── */
.phase-note{display:flex;gap:10px;align-items:flex-start;background:#fffbe6;border:1px solid #ffe58f;border-radius:var(--radius);padding:10px 14px;margin-bottom:var(--sp-md);font-size:12px;color:#5a4a00;line-height:1.55;}
.phase-note-icon{font-size:15px;flex-shrink:0;margin-top:1px;}
/* ── Scoring scheme ──────────────────────── */
.scoring-scheme{background:var(--color-surface);border-radius:var(--radius-lg);padding:16px 20px;box-shadow:var(--shadow);margin-bottom:var(--sp-md);}
.scoring-title{font-size:13px;font-weight:700;margin-bottom:10px;}
.scoring-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;}
.scoring-item{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 8px;border-radius:var(--radius-sm);background:var(--color-bg);}
.scoring-item.champion-row{background:#fff8e1;border:1px solid #ffe082;}
.scoring-round{color:var(--color-muted);font-weight:500;}
.scoring-pts{color:var(--color-text);}
/* ── Picks table ─────────────────────────── */
.picks-table-wrap{overflow-x:auto;border-radius:var(--radius-lg);box-shadow:var(--shadow);margin-bottom:4px;}
.picks-table{width:100%;border-collapse:collapse;background:var(--color-surface);white-space:nowrap;font-size:13px;}
.picks-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--color-muted);padding:10px 12px;border-bottom:2px solid var(--color-border);background:var(--color-surface);position:sticky;top:0;}
.picks-table td{padding:10px 12px;border-bottom:1px solid var(--color-border);vertical-align:middle;}
.picks-table tr:last-child td{border-bottom:none;}
.picks-table tr.lb-you{background:#f0faf5;}
.picks-cell{font-size:13px;}
.picks-cell .pick-flag{font-size:16px;cursor:default;margin-right:2px;}
.picks-cell .pick-name{font-size:12px;color:var(--color-text);}
.picks-empty{color:var(--color-muted-2);}
.champ-cell{font-weight:600;}
.you-tag{font-size:10px;color:var(--mx-green);font-weight:400;margin-left:4px;}
.lb-score-cell{font-size:14px;white-space:nowrap;}
.th-sub{font-size:10px;font-weight:400;opacity:.7;}
.pick-flag{display:inline-block;}
/* ── Admin ───────────────────────────────── */
.admin-page{display:flex;justify-content:center;padding:var(--sp-xl) var(--sp-md);}
.admin-card{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:32px 28px;max-width:680px;width:100%;}
.admin-title{font-size:18px;font-weight:700;margin-bottom:4px;}

function randCode(len, chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789') {
  let s=''; for(let i=0;i<len;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s;
}

async function fbCreateGroup(name) {
  const groupCode = randCode(6);
  const sharedPassword = randCode(4,'ABCDEFGHJKLMNPQRSTUVWXYZ23456789');
  const adminPassword = randCode(8);
  await db.collection('groups').doc(groupCode).set({
    name, sharedPassword, adminPassword,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  return { groupCode, sharedPassword, adminPassword };
}

async function fbVerifyGroup(code, password) {
  const doc = await db.collection('groups').doc(code.toUpperCase()).get();
  if (!doc.exists) return null;
  const d = doc.data();
  if (d.sharedPassword !== password.toUpperCase()) return null;
  return { groupName: d.name, adminPassword: d.adminPassword, sharedPassword: d.sharedPassword };
}

async function fbSubmitPick(groupCode, displayName, bracketState) {
  const payload = {
    displayName,
    groupStandings: bracketState.groupStandings,
    selectedBestThird: bracketState.selectedBestThird,
    bracket: bracketState.bracket,
    champion: bracketState.bracket?.champion || null,
    score: null,
    submittedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  const ref = await db.collection('groups').doc(groupCode).collection('entries').add(payload);
  return ref.id;
}

async function fbUpdatePick(groupCode, entryId, bracketState) {
  await db.collection('groups').doc(groupCode).collection('entries').doc(entryId).update({
    groupStandings: bracketState.groupStandings,
    selectedBestThird: bracketState.selectedBestThird,
    bracket: bracketState.bracket,
    champion: bracketState.bracket?.champion || null,
  });
}

async function fbSubmitResults(groupCode, adminPassword, bracketState) {
  const doc = await db.collection('groups').doc(groupCode).get();
  if (!doc.exists || doc.data().adminPassword !== adminPassword) throw new Error('invalid_admin');
  const resultsPayload = {
    groupStandings: bracketState.groupStandings,
    selectedBestThird: bracketState.selectedBestThird,
    bracket: bracketState.bracket,
    champion: bracketState.bracket?.champion || null,
    enteredAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  await db.collection('groups').doc(groupCode).collection('entries').doc('resultados_oficiales').set(resultsPayload);
  const entries = await db.collection('groups').doc(groupCode).collection('entries').get();
  const batch = db.batch();
  entries.docs.forEach(d => {
    if (d.id === 'resultados_oficiales') return;
    const score = computeScore(d.data(), bracketState);
    batch.update(d.ref, { score });
  });
  await batch.commit();
}

async function fbLoadLeaderboard(groupCode) {
  const [entriesSnap, resultsSnap] = await Promise.all([
    db.collection('groups').doc(groupCode).collection('entries').get(),
    db.collection('groups').doc(groupCode).collection('entries').doc('resultados_oficiales').get()
  ]);
  const hasResults = resultsSnap.exists;
  const entries = entriesSnap.docs
    .filter(d => d.id !== 'resultados_oficiales')
    .map(d => ({ id: d.id, ...d.data() }))
    .sort((a,b) => (b.score ?? -1) - (a.score ?? -1));
  return { entries, hasResults };
}

async function fbRecalculateAllScores(official) {
  const groupsSnap = await db.collection('groups').get();
  let totalUpdated = 0;
  for (const groupDoc of groupsSnap.docs) {
    const entriesSnap = await groupDoc.ref.collection('entries').get();
    const batch = db.batch();
    let batchSize = 0;
    entriesSnap.docs.forEach(d => {
      if (d.id === 'resultados_oficiales') return;
      const score = computeScoreVsOfficial(d.data(), official);
      batch.update(d.ref, { score });
      batchSize++;
      totalUpdated++;
    });
    if (batchSize > 0) await batch.commit();
  }
  return totalUpdated;
}

function getR32Teams(state) {
  const teams = new Set();
  const gs = state.groupStandings || {};
  for (const g of Object.keys(gs)) {
    if (gs[g]?.[0]) teams.add(gs[g][0]);
    if (gs[g]?.[1]) teams.add(gs[g][1]);
  }
  (state.selectedBestThird || []).forEach(t => teams.add(t));
  return teams;
}

function getTeamsInRound(bracket, round) {
  const teams = new Set();
  (bracket?.[round] || []).forEach(m => {
    if (m.top) teams.add(m.top);
    if (m.bottom) teams.add(m.bottom);
  });
  return teams;
}

function computeScore(userState, realState) {
  if (!userState || !realState) return 0;
  let score = 0;

  // 32 teams que llegan a R32 (1 pt c/u = máx 32 pts)
  const userR32 = getR32Teams(userState);
  const realR32 = getR32Teams(realState);
  userR32.forEach(t => { if (realR32.has(t)) score += 1; });

  // 16 equipos en octavos (2 pts c/u = máx 32 pts)
  const userR16 = getTeamsInRound(userState.bracket, 'roundOf16');
  const realR16 = getTeamsInRound(realState.bracket, 'roundOf16');
  userR16.forEach(t => { if (realR16.has(t)) score += 2; });

  // 8 equipos en cuartos (4 pts c/u = máx 32 pts)
  const userQF = getTeamsInRound(userState.bracket, 'quarterFinals');
  const realQF = getTeamsInRound(realState.bracket, 'quarterFinals');
  userQF.forEach(t => { if (realQF.has(t)) score += 4; });

  // 4 equipos en semis (8 pts c/u = máx 32 pts)
  const userSF = getTeamsInRound(userState.bracket, 'semiFinals');
  const realSF = getTeamsInRound(realState.bracket, 'semiFinals');
  userSF.forEach(t => { if (realSF.has(t)) score += 8; });

  // 2 finalistas (16 pts c/u = máx 32 pts)
  const userFinal = getTeamsInRound(userState.bracket, 'final');
  const realFinal = getTeamsInRound(realState.bracket, 'final');
  userFinal.forEach(t => { if (realFinal.has(t)) score += 16; });

  // Campeón (32 pts)
  if (userState.bracket?.champion && userState.bracket.champion === realState.bracket?.champion) {
    score += 32;
  }

  return score;
}

function computeScoreVsOfficial(userState, official) {
  if (!userState || !official) return 0;
  let score = 0;
  const rounds = [
    { userSet: getR32Teams(userState),                                offArr: official.r32,    pts: 1  },
    { userSet: getTeamsInRound(userState.bracket, 'roundOf16'),       offArr: official.r16,    pts: 2  },
    { userSet: getTeamsInRound(userState.bracket, 'quarterFinals'),   offArr: official.qf,     pts: 4  },
    { userSet: getTeamsInRound(userState.bracket, 'semiFinals'),      offArr: official.sf,     pts: 8  },
    { userSet: getTeamsInRound(userState.bracket, 'final'),           offArr: official.final,  pts: 16 },
  ];
  for (const {userSet, offArr, pts} of rounds) {
    const offSet = new Set(offArr || []);
    userSet.forEach(t => { if (offSet.has(t)) score += pts; });
  }
  if (userState.bracket?.champion && userState.bracket.champion === official.champion) score += 32;
  return score;
}

function resolveSlot(code, gs, bt) {
  if (code.startsWith('W-'))  return gs[code.slice(2)][0];
  if (code.startsWith('RU-')) return gs[code.slice(3)][1];
  if (code.startsWith('B3-')) return bt[+code.slice(3)-1] || null;
  return null;
}

function fifaRank(t) { return TEAMS[t]?.fifaRank ?? 999; }

function sortedPair(a, b) {
  if (!a || !b) return [a, b];
  return fifaRank(a) <= fifaRank(b) ? [a, b] : [b, a];
}

  const teamGroup = {};
  Object.entries(gs).forEach(([grp, ts]) => { if (ts[2]) teamGroup[ts[2]] = grp; });
  const sorted = [...teams].sort((a,b) => fifaRank(a)-fifaRank(b));
  const assigned = new Array(8).fill(null);
  const used = new Set();
  for (let slot = 0; slot < 8; slot++) {
    const eligible = B3_ELIGIBLE[slot];
    const team = sorted.find(t => !used.has(t) && eligible.includes(teamGroup[t]))
               || sorted.find(t => !used.has(t)); // fallback if no eligible team remains
    if (team) { assigned[slot] = team; used.add(team); }
  }
  return assigned;
}

function buildRoundOf32(gs, bestThird) {
  const bt = assignBestThird(bestThird, gs);
  return R32_SLOTS.map((slot, i) => {
    let [top, bottom] = sortedPair(resolveSlot(slot.top,gs,bt), resolveSlot(slot.bottom,gs,bt));
    return {id:`r32-${i}`, top, bottom, winner:null};
  });
}

const ROUND_KEYS = ['roundOf32','roundOf16','quarterFinals','semiFinals','final'];
const ROUND_SIZES = {roundOf32:16,roundOf16:8,quarterFinals:4,semiFinals:2,final:1};

function emptyRounds() {
  const r = {};
  ROUND_KEYS.forEach(k => {
    r[k] = Array.from({length:ROUND_SIZES[k]},(_,i) => ({id:`${k}-${i}`,top:null,bottom:null,winner:null}));
  });
  return r;
}

function initBracket(r32) {
  const b = emptyRounds();
  b.roundOf32 = r32;
  return b;
}

function pickWinner(bracket, roundKey, matchId, winner) {
  const b = JSON.parse(JSON.stringify(bracket));
  const round = b[roundKey];
  const matchIdx = round.findIndex(m => m.id === matchId);
  if (matchIdx === -1) return b;
  const prevWinner = round[matchIdx].winner;
  round[matchIdx].winner = winner;
  if (prevWinner !== winner) propagate(b, roundKey, matchIdx, winner);
  return b;
}

function propagate(b, roundKey, matchIdx, newWinner) {
  const nextKey = ROUND_KEYS[ROUND_KEYS.indexOf(roundKey)+1];
  if (!nextKey) { if (roundKey === 'final') b.champion = newWinner; return; }
  if (roundKey === 'final') { b.champion = newWinner; return; }
  const nextIdx = Math.floor(matchIdx/2);
  const isTop = matchIdx%2 === 0;
  const nm = b[nextKey][nextIdx];
  if (!nm) return;
  if (isTop) nm.top = newWinner; else nm.bottom = newWinner;
  // re-sort top/bottom by FIFA rank
  const [s1,s2] = sortedPair(nm.top, nm.bottom);
  nm.top = s1; nm.bottom = s2;
  // Clear winner only if the winner is no longer one of the two teams in the match
  if (nm.winner && nm.top !== nm.winner && nm.bottom !== nm.winner) {
    nm.winner = null;
    propagate(b, nextKey, nextIdx, null);
  }
}

function getThirdPlaceTeams(gs) {
  return Object.entries(gs).map(([group,teams]) => ({team:teams[2],group}));
}

function autoSelectBestThird(entries) {
  return [...entries].sort((a,b)=>fifaRank(a.team)-fifaRank(b.team)).slice(0,8).map(e=>e.team);
}

const INIT = {
  tab:'bracket', phase:'lobby',
  lobbyStep:'main',
  quiniela:null,
  leaderboardData:null,
  adminState: null,
  groupStandings: JSON.parse(JSON.stringify(DEFAULT_GROUPS)),
  thirdPlaceTeams:[], selectedBestThird:[], bracket:null,
};
let S = JSON.parse(JSON.stringify(INIT));

function dispatch(action) {
  S = reduce(S, action);
  render();
}

function reduce(s, a) {
  switch(a.type) {
    case 'SWITCH_TAB': return {...s, tab:a.tab};
    case 'MOVE_TEAM': {
      const t = [...s.groupStandings[a.group]];
      const i = t.indexOf(a.team);
      const ni = a.dir==='up'?i-1:i+1;
      if (ni<0||ni>=t.length) return s;
      [t[i],t[ni]]=[t[ni],t[i]];
      return {...s,groupStandings:{...s.groupStandings,[a.group]:t}};
    }
    case 'REORDER_GROUP': {
      const t = [...s.groupStandings[a.group]];
      const fi = t.indexOf(a.from), ti = t.indexOf(a.to);
      if(fi===-1||ti===-1) return s;
      t.splice(fi,1); t.splice(ti,0,a.from);
      return {...s,groupStandings:{...s.groupStandings,[a.group]:t}};
    }
    case 'LOCK_GROUPS': {
      const tp = getThirdPlaceTeams(s.groupStandings);
      const sel = autoSelectBestThird(tp);
      return {...s,phase:'best-third',thirdPlaceTeams:tp,selectedBestThird:sel};
    }
    case 'BACK_TO_GROUPS':
      return {...s,phase:'group',thirdPlaceTeams:[],selectedBestThird:[]};
    case 'TOGGLE_THIRD': {
      const sel = s.selectedBestThird;
      const has = sel.includes(a.team);
      if(!has && sel.length>=8) return s;
      return {...s,selectedBestThird:has?sel.filter(t=>t!==a.team):[...sel,a.team]};
    }
    case 'SET_BRACKET': {
      if(s.selectedBestThird.length!==8) return s;
      const r32 = buildRoundOf32(s.groupStandings,s.selectedBestThird);
      const bracket = initBracket(r32);
      return {...s,phase:'bracket',bracket};
    }
    case 'PICK_WINNER': {
      if(!s.bracket) return s;
      const nb = pickWinner(s.bracket,a.roundKey,a.matchId,a.winner);
      const fm = nb.final?.[0];
      if(fm?.winner) nb.champion = fm.winner;
      return {...s, bracket:nb, _showBracket: false};
    }
    case 'RESET_ALL': return {...JSON.parse(JSON.stringify(INIT)),tab:s.tab};
    case 'SET_LOBBY_STEP': return {...s, lobbyStep:a.step};
    case 'ENTER_SOLO': return {...s, phase:'group', quiniela:null, lobbyStep:'main'};
    case 'SET_QUINIELA': {
      try { localStorage.setItem('fifa-quiniela-session', JSON.stringify({quiniela:a.quiniela})); } catch(e){}
      return {...s, quiniela:a.quiniela, phase:'group', lobbyStep:'main',
        groupStandings:JSON.parse(JSON.stringify(DEFAULT_GROUPS)),
        thirdPlaceTeams:[], selectedBestThird:[], bracket:null};
    }
    case 'SHOW_LEADERBOARD': return {...s, phase:'leaderboard', leaderboardData:null};
    case 'SET_LEADERBOARD_DATA': return {...s, leaderboardData:a.data};
    case 'ENTER_RESULTS_MODE':
      return {...s, phase:'group', quiniela:{...s.quiniela, enteringResults:true},
        groupStandings:JSON.parse(JSON.stringify(DEFAULT_GROUPS)),
        thirdPlaceTeams:[], selectedBestThird:[], bracket:null};
    case 'BACK_TO_LOBBY': {
      try { localStorage.removeItem('fifa-quiniela-session'); } catch(e){}
      return {...JSON.parse(JSON.stringify(INIT)), tab:s.tab, phase:'lobby', lobbyStep:'main', quiniela:null};
    }
    case 'ENTER_ADMIN':
      return {...s, phase:'admin', adminState:{step:-1, r32:[], r16:[], qf:[], sf:[], final:[], champion:null, saving:false, saved:false, recalcStats:null, error:null, loadingExisting:false}};
    case 'ADMIN_AUTH':
      return {...s, adminState:{...s.adminState, step:0}};
    case 'ADMIN_LOAD_EXISTING':
      return {...s, adminState:{...s.adminState, loadingExisting:true}};
    case 'ADMIN_SET_EXISTING': {
      const r = a.data;
      return {...s, adminState:{...s.adminState, loadingExisting:false,
        r32: r.r32||[], r16: r.r16||[], qf: r.qf||[], sf: r.sf||[], final: r.final||[],
        champion: r.champion||null,
        step: r.champion ? 6 : r.final?.length===2 ? 5 : r.sf?.length===4 ? 4 : r.qf?.length===8 ? 3 : r.r16?.length===16 ? 2 : r.r32?.length===32 ? 1 : 0
      }};
    }
    case 'ADMIN_TOGGLE_TEAM': {
      const as = s.adminState;
      const key = a.key;
      const max = {r32:32,r16:16,qf:8,sf:4,final:2,champion:1}[key];
      const cur = as[key];
      const isArr = Array.isArray(cur);
      if (!isArr) {
        // champion
        return {...s, adminState:{...as, champion: as.champion===a.team?null:a.team}};
      }
      const has = cur.includes(a.team);
      if (!has && cur.length >= max) return s;
      return {...s, adminState:{...as, [key]: has ? cur.filter(t=>t!==a.team) : [...cur, a.team]}};
    }
    case 'ADMIN_NEXT_STEP':
      return {...s, adminState:{...s.adminState, step: s.adminState.step + 1}};
    case 'ADMIN_PREV_STEP':
      return {...s, adminState:{...s.adminState, step: Math.max(0, s.adminState.step - 1)}};
    case 'ADMIN_SAVING':
      return {...s, adminState:{...s.adminState, saving:true, error:null}};
    case 'ADMIN_SAVED':
      return {...s, adminState:{...s.adminState, saving:false, saved:true, recalcStats:a.stats, error:null}};
    case 'ADMIN_ERROR':
      return {...s, adminState:{...s.adminState, saving:false, error:a.msg}};
    case 'EXIT_ADMIN':
      return {...s, phase:'lobby', adminState:null};
    default: return s;
  }
}

const appEl = document.getElementById('app');

function render() {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===S.tab));
  appEl.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'page';
  if (S.tab==='stats') {
    wrap.innerHTML = renderStats();
    appEl.appendChild(wrap);
    bindStats(wrap);
    return;
  }
  if (S.phase==='lobby') {
    wrap.innerHTML = renderLobby();
    appEl.appendChild(wrap);
    bindLobby(wrap);
    return;
  }
  if (S.phase==='leaderboard') {
    wrap.innerHTML = renderLeaderboard();
    appEl.appendChild(wrap);
    bindLeaderboard(wrap);
    if (!S.leaderboardData) {
      fbLoadLeaderboard(S.quiniela.groupCode).then(data => dispatch({type:'SET_LEADERBOARD_DATA',data})).catch(err => dispatch({type:'SET_LEADERBOARD_DATA',data:{error:err.message||'Error de conexión'}}));
    }
    return;
  }
  if (S.phase==='admin') {
    wrap.innerHTML = renderAdmin();
    appEl.appendChild(wrap);
    bindAdmin(wrap);
    return;
  }
  let banner = '';
  if (S.quiniela) {
    const label = S.quiniela.enteringResults ? '⚠️ Ingresando resultados reales' : `👤 ${S.quiniela.displayName}`;
    banner = `<div class="quiniela-banner"><strong>${S.quiniela.groupName}</strong><span class="qb-sep">|</span>${label}<span class="qb-sep">|</span>Código: <strong>${S.quiniela.groupCode}</strong></div>`;
  }
  if (S.phase==='group') {
    wrap.innerHTML = banner + renderGroupStage();
    appEl.appendChild(wrap);
    bindGroupStage(wrap);
  } else if (S.phase==='best-third') {
    wrap.innerHTML = banner + renderBestThird();
    appEl.appendChild(wrap);
    bindBestThird(wrap);
  } else {
    if (S.bracket?.champion && !S._showBracket) {
      wrap.innerHTML = banner + renderChampion(S.bracket.champion);
    } else {
      wrap.innerHTML = banner + renderBracket();
    }
    appEl.appendChild(wrap);
    bindBracket(wrap);
  }
}

function extractPicks(bracket) {
  if (!bracket) return null;
  const winnersOf = (key) => (bracket[key]||[]).map(m=>m.winner).filter(Boolean);
  const finalist = (bracket.final||[]).flatMap(m=>[m.top,m.bottom]).filter(t=>t&&t!==bracket.champion)[0]||null;
  return {
    champion:  bracket.champion,
    finalist,
    semis:     winnersOf('quarterFinals'),  // 4 equipos que jugaron SF
    quarters:  winnersOf('roundOf16'),      // 8 equipos que jugaron QF
    r16:       winnersOf('roundOf32'),      // 16 equipos que jugaron octavos
  };
}

function flagCell(teams, max) {
  if (!teams||!teams.length) return '<span class="picks-empty">—</span>';
  const show = max ? teams.slice(0,max) : teams;
  return show.map(t=>`<span class="pick-flag" title="${t}">${TEAMS[t]?.flag||'🏳'}</span>`).join('');
}

function bindGroupStage(wrap) {
  wrap.querySelector('#lock-btn').addEventListener('click', ()=>dispatch({type:'LOCK_GROUPS'}));
  wrap.addEventListener('click', e => {
    const btn = e.target.closest('.arrow-btn');
    if(btn) dispatch({type:'MOVE_TEAM',group:btn.dataset.group,team:btn.dataset.team,dir:btn.dataset.dir});
  });
  // DnD
  let dragTeam=null, dragGroup=null;
  wrap.addEventListener('dragstart', e => {
    const row = e.target.closest('.team-row'); if(!row) return;
    dragTeam=row.dataset.team; dragGroup=row.dataset.group;
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed='move';
  });
  wrap.addEventListener('dragend', e => {
    e.target.closest('.team-row')?.classList.remove('dragging');
    wrap.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
    dragTeam=dragGroup=null;
  });
  wrap.addEventListener('dragover', e => {
    e.preventDefault();
    const row = e.target.closest('.team-row');
    if(!row||row.dataset.group!==dragGroup) return;
    wrap.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
    row.classList.add('drag-over');
    e.dataTransfer.dropEffect='move';
  });
  wrap.addEventListener('dragleave', e => { e.target.closest('.team-row')?.classList.remove('drag-over'); });
  wrap.addEventListener('drop', e => {
    e.preventDefault();
    const row = e.target.closest('.team-row');
    if(!row||!dragTeam) return;
    row.classList.remove('drag-over');
    if(row.dataset.group===dragGroup && row.dataset.team!==dragTeam)
      dispatch({type:'REORDER_GROUP',group:dragGroup,from:dragTeam,to:row.dataset.team});
  });
}

// BRACKET
// ─────────────────────────────────────────────────────────────
const ROUND_CFG = [
  {key:'roundOf32',    label:'Ronda de 32',      cls:'r32',   sk:'roundOf32'},
  {key:'roundOf16',   label:'Octavos de Final', cls:'r16',   sk:'roundOf16'},
  {key:'quarterFinals',label:'Cuartos de Final', cls:'qf',    sk:'quarterFinals'},
  {key:'semiFinals',  label:'Semifinales',      cls:'sf',    sk:'semiFinals'},
  {key:'final',       label:'Final',            cls:'final', sk:'final'},
];

function renderBracket() {
  const b = S.bracket;
  const rounds = ROUND_CFG.map((rc,ri) => {
    const matches = b[rc.key];
    const sched = SCHEDULE[rc.sk]||[];
    const slots = matches.map((m,mi) => {
      const s = sched[mi]||{};
      const isPairTop = mi%2===0 && rc.key!=='final';
      const info = s.date ? `${s.date} · ${s.city} · ${s.time}` : '';
      const bothKnown = m.top&&m.bottom;
      const topSlot = teamSlot(m.top, rc.key, m.id, m.winner, !!bothKnown);
      const botSlot = teamSlot(m.bottom, rc.key, m.id, m.winner, !!bothKnown);
      return `<div class="bracket-match-slot ${rc.cls}${isPairTop?' pair-top':''}">
        <div class="bracket-card">
          ${info?`<div class="bracket-match-info" title="${s.venue||''}">${info}</div>`:''}
          ${topSlot}${botSlot}
        </div>
      </div>`;
    }).join('');
    const gap = ri<ROUND_CFG.length-1?'<div class="bracket-gap"></div>':'';
    return `<div class="bracket-round"><div class="round-label">${rc.label}</div>${slots}</div>${gap}`;
  }).join('');

  return `<div class="phase-header">
    <div><div class="phase-title">Bracket de Eliminación</div>
    <div class="phase-subtitle">Haz clic en un equipo para elegirlo · Haz clic de nuevo para cambiar</div></div>
    <div class="bracket-phase-steps">
      <span class="step done">Grupos ✓</span><span class="sep">›</span>
      <span class="step done">Mejores 3ros ✓</span><span class="sep">›</span>
      <span class="step active">Bracket</span>
    </div>
  </div>
  <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center;">
    <button class="btn-ghost" id="back-to-third-btn">← Cambiar Terceros</button>
    <button class="btn-ghost" id="reset-btn">⟳ Empezar de Nuevo</button>
    ${S.quiniela?`<button class="btn-cta" id="finish-btn" style="margin-left:auto">Terminar y ver quiniela →</button>`:''}
    <span class="text-muted text-small" style="${S.quiniela?'width:100%':''}">Tip: cambiar un pick elimina automáticamente los partidos siguientes</span>
  </div>
  <div class="bracket-scroll-outer"><div class="bracket-inner">${rounds}</div></div>`;
}

function teamSlot(team, roundKey, matchId, winner, bothKnown) {
  if(!team) return `<div class="bracket-team tbd"><span class="bt-name tbd-text">PD</span></div>`;
  const t = TEAMS[team];
  const isWinner = winner===team, isLoser = winner&&winner!==team;
  let cls = 'bracket-team';
  if(isWinner) cls+=' winner';
  else if(isLoser) cls+=' loser';
  if(!bothKnown) cls+=' tbd';
  return `<div class="${cls}" data-team="${team}" data-round="${roundKey}" data-matchid="${matchId}"
    role="${bothKnown&&!isLoser?'button':''}" tabindex="${bothKnown&&!isLoser?0:-1}">
    <span class="bt-flag">${t?t.flag:'🏳'}</span>
    <span class="bt-name">${team}</span>
    ${isWinner?'<span class="bt-check">✓</span>':''}
  </div>`;
}

    const btn = wrap.querySelector('#submit-results-btn');
    btn.disabled=true; btn.textContent='Calculando...';
    try {
      await fbSubmitResults(S.quiniela.groupCode, S.quiniela.adminPassword, S);
      S = {...S, quiniela:{...S.quiniela, enteringResults:false}};
      dispatch({type:'SHOW_LEADERBOARD'});
    } catch(e) {
      btn.disabled=false; btn.textContent='📊 Calcular puntos';
      if(e.message==='invalid_admin') alert('Contraseña de admin incorrecta.');
      else alert('Error al calcular puntos. Intenta de nuevo.');
    }
  });
}

const ADMIN_STEPS = [
  { key:'r32',      label:'Dieciseisavos de Final', count:32, pts:'1 pt c/u = 32 pts' },
  { key:'r16',      label:'Octavos de Final',       count:16, pts:'2 pts c/u = 32 pts' },

  { key:'champion', label:'Campeón',                count:1,  pts:'32 pts' },
];

function getAdminPool(as, stepIdx) {
  if (stepIdx === 0) return Object.keys(TEAMS);
  const prevKey = ADMIN_STEPS[stepIdx - 1].key;
  if (prevKey === 'champion') return as.final || [];
  return as[prevKey] || [];
}

  const as = S.adminState;
  if (!as) return '';

  // Login step
  if (as.step === -1) {
    return `<div class="admin-page"><div class="admin-card">
      <div style="font-size:28px;margin-bottom:8px">🔐</div>

    </div></div>`;
  }

  // Status overview (step 6 = saved/review)
  if (as.step === 6) {
    const statusItems = [
      { label:'R32 — Dieciseisavos', val: as.r32.length,     max:32 },
      { label:'Octavos de Final',    val: as.r16.length,     max:16 },
      { label:'Cuartos de Final',    val: as.qf.length,      max:8  },
      { label:'Semifinales',         val: as.sf.length,      max:4  },
      { label:'Finalistas',          val: as.final.length,   max:2  },
      { label:'🏆 Campeón',          val: as.champion?1:0,   max:1  },
    ];
    const grid = statusItems.map(si => `
      <div class="admin-status-item ${si.val===si.max?'has-data':''}">
        <div class="admin-status-label">${si.label}</div>
        <div class="admin-status-val">${si.val===si.max?(si.label.includes('Campeón')?`${TEAMS[as.champion]?.flag||''} ${as.champion}`:`${si.val}/${si.max} ✓`):`${si.val}/${si.max}`}</div>
      </div>`).join('');
    const canSave = as.r32.length===32 && as.r16.length===16 && as.qf.length===8 && as.sf.length===4 && as.final.length===2 && as.champion;
    const savedBlock = as.saved ? `<div class="admin-success">✅ Resultados guardados y puntos recalculados para ${as.recalcStats?.count||0} participantes en todas las quinielas.</div>` : '';
    const errBlock = as.error ? `<div style="color:var(--mx-red);font-size:13px;margin-top:8px">${as.error}</div>` : '';
    return `<div class="admin-page"><div class="admin-card">
      <div class="admin-title">Resultados Oficiales</div>

      <div style="margin-top:16px"><button class="btn-ghost" id="admin-back-btn" style="font-size:12px">← Volver al inicio</button></div>
    </div></div>`;
  }

  // Selection step (0–5)
  const stepCfg = ADMIN_STEPS[as.step];
  const pool = getAdminPool(as, as.step);
  const selected = as.step < 5 ? (as[stepCfg.key] || []) : [as.champion].filter(Boolean);
  const isChampion = stepCfg.key === 'champion';
  const count = selected.length;
  const isFull = count >= stepCfg.count;

  const dots = ADMIN_STEPS.map((_, i) =>
    `<div class="admin-step-dot ${i < as.step ? 'done' : i === as.step ? 'active' : ''}"></div>`
  ).join('');

  const chips = pool.map(team => {
    const t = TEAMS[team];
    const isSel = selected.includes(team);
    const disabled = !isSel && isFull;
    return `<button class="admin-team-chip ${isSel?'selected':''} ${disabled?'disabled':''}"
      data-team="${team}" data-key="${stepCfg.key}"
      ${disabled?'disabled':''}>
      <span>${t?.flag||'🏳'}</span><span>${team}</span>
      <span class="chip-check">✓</span>
    </button>`;
  }).join('');

  const canNext = count === stepCfg.count;
  return `<div class="admin-page"><div class="admin-card">
    <div class="admin-step-bar">${dots}</div>
    <div class="admin-round-label">Paso ${as.step+1} de ${ADMIN_STEPS.length}</div>
    <div class="admin-round-title">${stepCfg.label}</div>
    <div class="admin-counter ${isFull?'full':''}">
      Seleccionados: <strong>${count}</strong> / ${stepCfg.count} &nbsp;·&nbsp; ${stepCfg.pts}
    </div>
    <div class="admin-team-grid">${chips}</div>
    <div class="admin-nav">
      ${as.step > 0 ? `<button class="btn-ghost" id="admin-prev-btn">← Atrás</button>` : `<button class="btn-ghost" id="admin-exit-btn">← Salir</button>`}
      <button class="btn-cta" id="admin-next-btn" ${!canNext?'disabled':''}>
        ${as.step < ADMIN_STEPS.length - 1 ? 'Siguiente →' : 'Revisar →'}
      </button>
    </div>
    <div style="margin-top:16px">
      <button class="btn-ghost" id="admin-load-btn" style="font-size:12px;color:var(--color-muted)">${as.loadingExisting?'Cargando...':'↓ Cargar resultados existentes'}</button>
    </div>
  </div></div>`;
}

function bindAdmin(wrap) {
  const as = S.adminState;
  if (!as) return;

  // Login
  wrap.querySelector('#admin-login-btn')?.addEventListener('click', () => {
    const pass = wrap.querySelector('#admin-pass')?.value?.trim();
    const err = wrap.querySelector('#admin-err');
    if (pass !== GLOBAL_ADMIN_PASSWORD) {
      err.textContent = 'Contraseña incorrecta.';
      err.classList.remove('hidden');
      return;
    }
    dispatch({type:'ADMIN_AUTH'});
  });
  wrap.querySelector('#admin-pass')?.addEventListener('keydown', e => {
    if (e.key==='Enter') wrap.querySelector('#admin-login-btn')?.click();
  });

  // Back / Exit
  wrap.querySelector('#admin-back-btn')?.addEventListener('click', ()=>dispatch({type:'EXIT_ADMIN'}));
  wrap.querySelector('#admin-exit-btn')?.addEventListener('click', ()=>dispatch({type:'EXIT_ADMIN'}));

  // Team chips
  wrap.querySelectorAll('.admin-team-chip:not([disabled])').forEach(chip => {
    chip.addEventListener('click', () => {
      dispatch({type:'ADMIN_TOGGLE_TEAM', key:chip.dataset.key, team:chip.dataset.team});
    });
  });

  // Prev / Next
  wrap.querySelector('#admin-prev-btn')?.addEventListener('click', ()=>dispatch({type:'ADMIN_PREV_STEP'}));
  wrap.querySelector('#admin-next-btn')?.addEventListener('click', ()=>dispatch({type:'ADMIN_NEXT_STEP'}));

  // Edit (go back to step 0)
  wrap.querySelector('#admin-edit-btn')?.addEventListener('click', ()=>{
    S = {...S, adminState:{...S.adminState, step:0, saved:false}};
    render();
  });

  // Save
  wrap.querySelector('#admin-save-btn')?.addEventListener('click', async ()=>{
    dispatch({type:'ADMIN_SAVING'});
    try {
      const as = S.adminState;
      const official = { r32:as.r32, r16:as.r16, qf:as.qf, sf:as.sf, final:as.final, champion:as.champion };
      await fbSaveOfficialResults(GLOBAL_ADMIN_PASSWORD, official);
      const count = await fbRecalculateAllScores(official);
      dispatch({type:'ADMIN_SAVED', stats:{count}});
    } catch(e) {
      dispatch({type:'ADMIN_ERROR', msg: e.message||'Error al guardar. Intenta de nuevo.'});
    }
  });

  // Load existing
  wrap.querySelector('#admin-load-btn')?.addEventListener('click', async ()=>{
    if (as.loadingExisting) return;
    dispatch({type:'ADMIN_LOAD_EXISTING'});
    try {
      const data = await fbLoadOfficialResults();
      if (data) {
        dispatch({type:'ADMIN_SET_EXISTING', data});
      } else {
        S = {...S, adminState:{...S.adminState, loadingExisting:false}};
        render();
        alert('No hay resultados guardados aún.');
      }
    } catch(e) {
      S = {...S, adminState:{...S.adminState, loadingExisting:false}};
      render();
      alert('Error al cargar: ' + e.message);
    }
  });
}

// ─────────────────────────────────────────────────────────────
// STATS
// ─────────────────────────────────────────────────────────────
function renderStats() {
  const groups = Object.keys(DEFAULT_GROUPS);
  const polyCards = groups.map(g => {
    const teams = [...DEFAULT_GROUPS[g]].sort((a,b)=>(POLYMARKET[b]??0)-(POLYMARKET[a]??0));
    const max = POLYMARKET[teams[0]]||1;
    const rows = teams.map(team => {
      const t=TEAMS[team]; const pct=POLYMARKET[team]??0;
      return `<div class="poly-team-row">
        <span style="font-size:16px">${t.flag}</span>
        <span style="font-size:12px;min-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${team}</span>
        <div class="poly-bar-wrap"><div class="poly-bar" style="width:${Math.round(pct/max*100)}%"></div></div>
        <span class="poly-pct">${pct}%</span>
      </div>`;
    }).join('');
    return `<div class="poly-group-card"><div class="poly-group-title">Grupo ${g}</div>${rows}</div>`;
  }).join('');

  const rankRows = Object.entries(TEAMS).sort((a,b)=>a[1].fifaRank-b[1].fifaRank).map(([name,t])=>
    `<tr>
      <td class="rank-num">#${t.fifaRank}</td>
      <td style="font-size:20px;line-height:1">${t.flag}</td>
      <td style="font-weight:500">${name}</td>
      <td><span class="rank-group-badge">${t.group}</span></td>
    </tr>`
  ).join('');

  return `<div class="phase-header">
    <div><div class="phase-title">Estadísticas</div>
    <div class="phase-subtitle">Datos usados para pre-ordenar los grupos</div></div>
  </div>
  <div class="stats-tabs">
    <button class="stats-tab active" data-tab="poly">Favoritos Polymarket</button>
    <button class="stats-tab" data-tab="fifa">Ranking FIFA</button>
  </div>
  <div id="sp-poly">
    <div class="stats-section-header">
      <span class="stats-section-title">Probabilidad de ganar el grupo</span>
      <span class="stats-updated">Actualizado ${DATA_DATES.polymarket}</span>
    </div>
    <div class="poly-groups-grid">${polyCards}</div>
    <p class="stats-source">Fuente: Polymarket — probabilidad implícita de ganar el grupo</p>
  </div>
  <div id="sp-fifa" class="hidden">
    <div class="stats-section-header">
      <span class="stats-section-title">Ranking Mundial FIFA</span>
      <span class="stats-updated">Actualizado ${DATA_DATES.fifaRankings}</span>
      <span class="stats-updated">Próxima actualización ${DATA_DATES.fifaNextUpdate}</span>
    </div>
    <table class="rankings-table">
      <thead><tr><th>Pos.</th><th>Bandera</th><th>Equipo</th><th>Grupo</th></tr></thead>
      <tbody>${rankRows}</tbody>
    </table>
    <p class="stats-source">Fuente: FIFA.com — Ranking Oficial FIFA/Coca-Cola</p>
  </div>`;
}

function bindStats(wrap) {
  wrap.querySelectorAll('.stats-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      wrap.querySelectorAll('.stats-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      const which = tab.dataset.tab;
      wrap.querySelector('#sp-poly').classList.toggle('hidden', which!=='poly');
      wrap.querySelector('#sp-fifa').classList.toggle('hidden', which!=='fifa');
    });
  });
}

// ─────────────────────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', ()=>dispatch({type:'SWITCH_TAB',tab:btn.dataset.tab}));
});

render();
</script>
</body>
</html>
